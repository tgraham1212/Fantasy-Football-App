[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffapp"
version = "0.1.0"
description = "Playoff odds and league history for Sleeper fantasy football leagues"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ffapp = "ffapp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
