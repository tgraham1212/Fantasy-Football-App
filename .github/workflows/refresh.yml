name: Refresh odds

on:
  schedule:
    # Daily at 11:00 UTC, so Tuesday's run has Monday night's game scored. Always refreshes.
    - cron: "0 11 * * *"
    # Hourly check: refreshes ~40-60 minutes before a kickoff and after games go final,
    # at most once every three hours (see `ffapp should-run`).
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two refreshes overlap or race on the push.
concurrency:
  group: refresh-odds
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Decide whether to refresh
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then mode=manual
          elif [ "${{ github.event.schedule }}" = "0 11 * * *" ]; then mode=daily
          else mode=check; fi
          python -m ffapp should-run --mode "$mode"

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Refresh data, odds and site files
        run: python -m ffapp refresh

      - name: Commit stored data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh odds $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      # Stamp script and stylesheet URLs with the site code fingerprint and publish it in
      # version.json, so browsers never pair a new page with cached old code and open pages
      # can tell new code from new data. Every deploy must use this command. Runs after the
      # commit, so no stamp is ever committed.
      - name: Stamp site
        run: python -m ffapp stamp-site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
