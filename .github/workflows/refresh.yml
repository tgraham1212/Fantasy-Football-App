name: Refresh odds

# The cold run (docs/refresh-modes.md): syncs the durable data, rebuilds everything derived from
# it, commits only changed records and deploys the site only when what visitors see changed.
# The refresh relay's clock (relay/worker.js) starts it every 15 minutes in season, when a slate
# goes final, and daily in the off-season, passing the mode. GitHub's daily schedule below is the
# fallback in case the relay's clock stops.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Refresh mode: live skips the simulation (the hot runs own the live forecast)"
        type: choice
        default: manual
        options: [manual, quiet, live, slate, offseason, daily, full]

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two cold runs (or a cold run and a code deploy) overlap or race on the push.
concurrency:
  group: refresh-odds
  cancel-in-progress: false

env:
  # Rebuilt data: never committed, carried between runs in the build cache. Keep in step with
  # DERIVED_PATHS in src/ffapp/store.py, .gitignore and hot.yml.
  BUILD_PATHS: |
    data/projections-future
    data/games-derived
    data/nfl-live
    data/model
    data/ratings
    data/replacement
    data/war
    data/odds/*/*/live.json
    data/refresh
    site/data

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      # The newest build cache on main (any earlier run's): the derived data this run updates.
      - name: Restore the build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_PATHS }}
          key: build-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: build-

      - name: Refresh data, odds and site files
        id: refresh
        run: python -m ffapp refresh --mode "${{ inputs.mode || 'daily' }}"

      - name: Find the refresh relay
        id: relay
        run: echo "url=$(python -c 'from ffapp.config import load_config; print(load_config().site.refresh_url or "")')" >> "$GITHUB_OUTPUT"

      # The relay's clock decides the refresh mode from this summary.
      - name: Upload the schedule summary
        if: steps.relay.outputs.url != '' && (steps.refresh.outputs.summary_changed == 'true' || inputs.mode == '' || inputs.mode == 'daily')
        env:
          HOT_TOKEN: ${{ secrets.HOT_TOKEN }}
        run: |
          if [ -z "$HOT_TOKEN" ]; then echo "::warning title=Schedule summary not uploaded::HOT_TOKEN is not set"; exit 0; fi
          curl -fsS -X PUT -H "Authorization: Bearer $HOT_TOKEN" -H "Content-Type: application/json" \
            --data-binary @data/refresh/schedule_summary.json "${{ steps.relay.outputs.url }}/schedule"

      - name: Commit changed records
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No record changed: nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh odds $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --quiet
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # Deploy only when the commit or what visitors see changed (refresh times ignored).
      - name: Decide whether to deploy
        id: site
        run: |
          new=$(python -m ffapp site-hash)
          old=$(cat data/refresh/site_hash 2>/dev/null || true)
          echo "$new" > data/refresh/site_hash
          if [ "$new" != "$old" ] || [ "${{ steps.commit.outputs.committed }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Site unchanged: no deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      # Stamp script and stylesheet URLs with the site code fingerprint and publish it in
      # version.json, so browsers never pair a new page with cached old code and open pages
      # can tell new code from new data. Every deploy must use this command. Runs after the
      # commit, so no stamp is ever committed.
      - name: Stamp site
        if: steps.site.outputs.deploy == 'true'
        run: python -m ffapp stamp-site

      - uses: actions/configure-pages@v5
        if: steps.site.outputs.deploy == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.deploy == 'true'
        with:
          path: site

      # GitHub sometimes can't find the Pages artifact just uploaded ("No artifacts named
      # github-pages were found"); a second try after a short wait finds it.
      - id: deployment
        if: steps.site.outputs.deploy == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying the deploy
        if: steps.site.outputs.deploy == 'true' && steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry the deploy
        if: steps.site.outputs.deploy == 'true' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # Saved last, so a failed deploy leaves the previous cache (and its site hash) in place.
      - name: Save the build cache
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_PATHS }}
          key: build-${{ github.run_id }}-${{ github.run_attempt }}
