name: Refresh odds

on:
  schedule:
    # Daily at 11:00 UTC, so Tuesday's run has Monday night's game scored.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two refreshes overlap or race on the push.
concurrency:
  group: refresh-odds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Refresh data, odds and site files
        run: python -m ffapp refresh

      - name: Commit stored data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh odds $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
