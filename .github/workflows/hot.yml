name: Hot refresh

# The hot run (docs/refresh-modes.md): this week's live scores, forecast and game cards as one
# bundle, uploaded to the refresh relay's KV store. Started by the relay's clock (back to back
# during games, every 15 minutes in season otherwise) and by the Refresh Data button. It never
# commits, pushes or deploys.
on:
  workflow_dispatch:

permissions:
  contents: read

# Its own group: never waits behind a cold run or a code deploy.
concurrency:
  group: hot
  cancel-in-progress: false

jobs:
  hot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      # The latest cold run's rebuilt data (same paths as refresh.yml's BUILD_PATHS).
      - name: Restore the build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/projections-future
            data/games-derived
            data/nfl-live
            data/model
            data/ratings
            data/replacement
            data/war
            data/odds/*/*/live.json
            data/refresh
            site/data
          key: build-none
          restore-keys: build-

      - name: Rebuild offline (no build cache)
        if: steps.cache.outputs.cache-matched-key == ''
        run: python -m ffapp build

      - name: Build the live bundle
        run: python -m ffapp hot --out "$RUNNER_TEMP/live.json"

      - name: Upload the bundle
        env:
          HOT_TOKEN: ${{ secrets.HOT_TOKEN }}
        run: |
          url=$(python -c 'from ffapp.config import load_config; print(load_config().site.refresh_url or "")')
          if [ -z "$url" ] || [ -z "$HOT_TOKEN" ]; then echo "::error title=Bundle not uploaded::the relay address or HOT_TOKEN is not set"; exit 1; fi
          curl -fsS -X PUT -H "Authorization: Bearer $HOT_TOKEN" -H "Content-Type: application/json" \
            -H "X-Bundle-Meta: $(cat "$RUNNER_TEMP/live.json.meta")" \
            --data-binary @"$RUNNER_TEMP/live.json" "$url/live"
