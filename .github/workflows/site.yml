name: Site deploy

# A push that changes site code builds the site data (from the latest cold run's build cache,
# or offline from the committed records), runs the tests and the layout check, then deploys, so
# new code goes live without waiting for the next data refresh. Data commits from the refresh workflow use the workflow token and never trigger
# this; the path filter leaves data out as well.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "!site/data/**"
      - "src/ffapp/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Same group as the refresh, so a code deploy and a data refresh never overlap.
concurrency:
  group: refresh-odds
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,browser]"

      # site/data is not in git: restore the latest cold run's build, or rebuild it offline.
      - name: Restore the build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/projections-future
            data/games-derived
            data/nfl-live
            data/model
            data/ratings
            data/replacement
            data/war
            data/odds/*/*/live.json
            data/refresh
            site/data
          key: build-none
          restore-keys: build-

      - name: Build site data offline (no build cache)
        if: steps.cache.outputs.cache-matched-key == ''
        run: python -m ffapp build


      # Chromium tests use the Chrome preinstalled on the runner; WebKit (Safari's engine) and
      # Firefox come from Playwright's own builds.
      - name: Install WebKit and Firefox
        run: python -m playwright install --with-deps webkit firefox

      # The layout check must not skip here.
      - name: Test (with the layout check)
        env:
          LAYOUT_REQUIRED: "1"
        run: pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      # site/data is not in git: restore the latest cold run's build, or rebuild it offline.
      - name: Restore the build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/projections-future
            data/games-derived
            data/nfl-live
            data/model
            data/ratings
            data/replacement
            data/war
            data/odds/*/*/live.json
            data/refresh
            site/data
          key: build-none
          restore-keys: build-

      - name: Build site data offline (no build cache)
        if: steps.cache.outputs.cache-matched-key == ''
        run: python -m ffapp build

      # Every deploy stamps through this command (see the refresh workflow).
      - name: Stamp site
        run: python -m ffapp stamp-site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
