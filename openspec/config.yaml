schema: spec-driven

context: |
  Every deploy of site/ goes through `python -m ffapp stamp-site` before the Pages upload
  (code fingerprint in script and stylesheet URLs, plus site/version.json); a new deploying
  workflow must call it and must never stamp by hand. Every new script, stylesheet link or
  module import in site/ carries `?v=__BUILD__`. Every new button, toggle, selector or
  expander on the site is added to the layout check registry (tests/layout/controls.py)
  with its states and declared effect. Every new piece of descriptive site text (page or
  tab description, heading, chart title or note, explanation, message) gets a copy ID
  (`data-copy="ID"` in HTML, `/*copy:ID*/` before a script string) and is regenerated into
  site-copy.txt with `python -m ffapp site-copy` in the same change. When the tests report
  pending copy edits in site-copy.txt, confirm with the owner before running
  `python -m ffapp site-copy --apply`; never apply or discard them unasked.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
