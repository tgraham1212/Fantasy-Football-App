schema: spec-driven

context: |
  Every deploy of site/ goes through `python -m ffapp stamp-site` before the Pages upload
  (code fingerprint in script and stylesheet URLs, plus site/version.json); a new deploying
  workflow must call it and must never stamp by hand. Every new script, stylesheet link or
  module import in site/ carries `?v=__BUILD__`. Every new button, toggle, selector or
  expander on the site is added to the layout check registry (tests/layout/controls.py)
  with its states and declared effect. Every new piece of descriptive site text (page or
  tab description, heading, chart title or note, explanation, message) gets a copy ID
  (`data-copy="ID"` in HTML, `/*copy:ID*/` before a script string) and is regenerated into
  site-copy.txt with `python -m ffapp site-copy` in the same change. When the tests report
  pending copy edits in site-copy.txt, confirm with the owner before running
  `python -m ffapp site-copy --apply`; never apply or discard them unasked.

  Project standards (every change follows these; existing gaps are tracked by the baselines in
  tests/baselines/, which may only shrink):
  - Browsers: Chrome, Safari, Edge and Firefox on desktop; Chrome and Safari on phones. The
    layout check runs Chromium (Chrome, Edge), WebKit (Safari's engine) and Firefox.
  - Phone widths: the most common US mobile widths from StatCounter (gs.statcounter.com,
    screen-resolution-stats/mobile/united-states-of-america). October 2026: 414 (20.3%), 390
    (9.5%), 384 (9.0%), 360 (4.6%), 402 (4.3%), 393 (4.1%). Tested at 360, 390, 414 and 440 px
    (440 = largest current iPhone, the owner's phone), plus 768, 1000 and 1280. Re-check the
    statistics yearly and when a new phone width enters the top six.
  - Accessibility: WCAG 2.2 AA, checked with axe-core in the layout check, in light and dark mode.
  - Colour: colours are defined and adjusted in OKLCH (reference: https://oklch.fyi/). Fix a
    contrast problem by changing lightness (L) and keeping hue and chroma; derive new colours
    from existing hues (tools/team_palette.py has the OKLCH helpers). Text needs 4.5:1 and focus
    rings and chart lines 3:1, in both modes, checked by tests/test_colour_contrast.py, which
    also makes every new colour token be checked or exempted with a reason.
  - Player names: show a player's full name; switch to first initial and last name
    ("A. St. Brown"; a defence by its team nickname) only when the full name does not fit its
    space, keep the full name in a tooltip, and never cut a name off. Fit names after rendering
    and again on resize or when hidden content is shown (shortPlayerName, nameAttrs and fitNames
    in site/games.js and site/managers.js).
  - Material Design 3: FOLLOW its usability rules (touch targets of at least 48 x 48 px on
    phones, visible focus and pressed states, a consistent type scale). DO NOT adopt its visual
    system (components, colour roles, shapes, elevation); the site keeps its own look.
  - Nomenclature, in everything people read (site text, docs, specs; not code or data
    identifiers): Managers, Team Names, Players, Forecasts (simulation output), Projections
    (Sleeper's inputs only); "owner", "odds", "chances" and "predictions" are retired. The rules
    and every project term are defined in openspec/glossary.md.
  - Style: APA. Title case for titles and headings; APA conventions in prose.
  - Calculations: every formula and calculation is documented in Calculations.txt (formula,
    data sources, dependencies, plain-English description, assumptions and decisions). A
    change that alters a calculation updates its section in the same change; a new
    calculation module gets a section and is added to tests/test_calculations_doc.py.
  - Feature docs: a feature or subsystem whose flow is worth explaining gets docs/<feature>.md,
    a living document with a generated diagram. The doc opens with what the feature does, then
    Code, Runs and Tests bullets naming its files; a "## Diagram" section shows
    images/<feature>/diagram.svg, says how to read it and gives the redraw command; the body
    answers where the data comes from, where it is stored, how it is calculated (citing
    Calculations.txt sections as "Calc N") and where it shows on the site; it ends with
    "## Keeping This Document Current". The diagram is drawn by tools/<feature>_diagram.py
    (Python writing SVG, never edited by hand), and its wording matches the doc. Each doc is
    registered in tests/test_feature_docs.py with the code files whose changes must update
    it; a change that touches one of those files updates the doc and redraws its diagram in
    the same change. The test fails on a stale diagram, an unregistered doc, or a cited path
    or Calc section that does not exist. Nomenclature and APA style apply.
  - Requirements: every requirement follows the requirements standard (NASA Systems
    Engineering Handbook, Appendix C; the project-standards spec, 10.x; docs/requirements.md).
    One positive statement with one SHALL (never SHALL NOT), no banned terms (openspec/glossary.md),
    a unit and tolerance on every value, a one-line **Rationale:** where the reason is not evident.
    Each heading starts with a hierarchical ID: needs (openspec/specs/needs/spec.md) are 1, 2, 3;
    a derived requirement is its primary parent's ID plus the next unused number (1.1, 1.1.2).
    Each requirement carries **Traces to:** (parent IDs, primary first; more than three is
    reported) and **Verified by:** (Test: `tests/<file>.py::<function>`, Analysis, Inspection
    with a row in openspec/inspection-checklist.md, Demonstration, or Gap: what would verify it),
    plus **TBR:** with a target date for anything not yet settled. IDs are never reused
    (openspec/retired-requirements.md). tests/test_requirements.py enforces this; its baselines
    may only shrink. Editing a spec means redoing its dated standard review in the inspection
    checklist and redrawing the diagrams (python -X utf8 tools/requirements_diagram.py).

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  tasks:
    - When the change touches a file registered for a feature doc in tests/test_feature_docs.py
      (FEATURE_DOCS), include a task to update that docs/<feature>.md and redraw its diagram with
      tools/<feature>_diagram.py. When the change adds a feature whose flow is worth explaining,
      include a task to write its feature doc and diagram generator and register them.
    - Write every new or changed requirement to the requirements standard (project context,
      Requirements). Before changing an existing requirement, run
      python -X utf8 tools/requirements_impact.py <ID> and include tasks for the requirements it
      lists that the change affects. Include a task to redo the standard review of each spec the
      change edits (openspec/inspection-checklist.md) and to redraw the requirements diagrams.
  design:
    - Name the feature docs (docs/<feature>.md) the change affects, or say that none are affected.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
