<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1574 857.5" width="1574" height="857.5" role="img" aria-labelledby="sim-t" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<style>
.grp { stroke-width: 1.5; } .g1 { fill: #efeeeb; stroke: #8c8a84; } .g2 { fill: #eef1f6; stroke: #93a0b8; }
.g3 { fill: #fbf2e1; stroke: #c08a2c; } .g4 { fill: #e8f0fb; stroke: #4f7cc0; } .g5 { fill: #e8f5ea; stroke: #4f9a5c; }
.gl { font-weight: 700; font-size: 13px; letter-spacing: 0.06em; fill: #4c5058; }
.gs { font-size: 11.5px; fill: #4c5058; }
.st { fill: #ffffff; stroke: #2b2f36; stroke-width: 1.4; } .st.rebuilt { stroke-dasharray: 5 3; }
.stt { font-weight: 700; font-size: 12.5px; fill: #14161a; } .sd { font-size: 11.5px; fill: #4c5058; }
.ref { font-size: 10.5px; font-weight: 700; fill: #b4530b; font-family: ui-monospace, Consolas, monospace; }
.path { font-size: 11px; fill: #2b2f36; font-family: ui-monospace, Consolas, monospace; }
.e { fill: none; stroke: #2b2f36; stroke-width: 1.5; } .ah { fill: #2b2f36; }
.lg { font-size: 12.5px; fill: #2b2f36; } .lgn { font-weight: 800; }
</style>
<rect width="1574" height="857.5" fill="#ffffff"/>
<title id="sim-t">How the simulation works: its sources, where the data is stored, the calculations in order, what they produce and the pages that show it</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs>
<text x="24" y="34" class="gl" text-anchor="start">HOW THE SIMULATION WORKS</text>
<rect x="24" y="64" width="250" height="641.5" rx="10" class="grp g1"/>
<text x="38" y="88" class="gl" text-anchor="start">1. WHERE IT COMES FROM</text>
<text x="38" y="106" class="gs" text-anchor="start">Fetched by each cold run</text>
<rect x="36" y="122" width="226" height="76.5" rx="8" class="st"/>
<text x="48" y="142" class="stt" text-anchor="start">Sleeper: League Data</text>
<text x="48" y="159.5" class="sd" text-anchor="start">Rosters, lineups, matchups, schedule,</text>
<text x="48" y="175.0" class="sd" text-anchor="start">playoff brackets, scoring settings,</text>
<text x="48" y="190.5" class="sd" text-anchor="start">transactions</text>
<rect x="36" y="210.5" width="226" height="61.0" rx="8" class="st"/>
<text x="48" y="230.5" class="stt" text-anchor="start">Sleeper: Projections</text>
<text x="48" y="248.0" class="sd" text-anchor="start">Each player&#x27;s expected stat line for a</text>
<text x="48" y="263.5" class="sd" text-anchor="start">week (Rotowire via Sleeper)</text>
<rect x="36" y="283.5" width="226" height="61.0" rx="8" class="st"/>
<text x="48" y="303.5" class="stt" text-anchor="start">Sleeper: Stats</text>
<text x="48" y="321.0" class="sd" text-anchor="start">Every player&#x27;s actual stat line;</text>
<text x="48" y="336.5" class="sd" text-anchor="start">corrections replace the old line</text>
<rect x="36" y="356.5" width="226" height="61.0" rx="8" class="st"/>
<text x="48" y="376.5" class="stt" text-anchor="start">ESPN Scoreboard</text>
<text x="48" y="394.0" class="sd" text-anchor="start">NFL kickoffs, quarter and clock,</text>
<text x="48" y="409.5" class="sd" text-anchor="start">final scores</text>
<rect x="36" y="429.5" width="226" height="61.0" rx="8" class="st"/>
<text x="48" y="449.5" class="stt" text-anchor="start">config/leagues.yaml</text>
<text x="48" y="467.0" class="sd" text-anchor="start">Runs per Forecast (10,000), scoring</text>
<text x="48" y="482.5" class="sd" text-anchor="start">overrides, replacement settings</text>
<rect x="308" y="64" width="270" height="641.5" rx="10" class="grp g2"/>
<text x="322" y="88" class="gl" text-anchor="start">2. WHERE IT IS STORED</text>
<text x="322" y="106" class="gs" text-anchor="start">Records in git; rebuilt files in the build cache</text>
<rect x="320" y="122" width="246" height="61.0" rx="8" class="st"/>
<text x="332" y="142" class="stt" text-anchor="start">League Data</text>
<text x="332" y="159.5" class="path" text-anchor="start">data/leagues/</text>
<text x="332" y="175.0" class="sd" text-anchor="start">One folder per league and season</text>
<rect x="320" y="195.0" width="246" height="61.0" rx="8" class="st"/>
<text x="332" y="215.0" class="stt" text-anchor="start">Projections</text>
<text x="332" y="232.5" class="path" text-anchor="start">data/projections/</text>
<text x="332" y="248.0" class="sd" text-anchor="start">Current and earlier weeks</text>
<rect x="320" y="268.0" width="246" height="61.0" rx="8" class="st rebuilt"/>
<text x="332" y="288.0" class="stt" text-anchor="start">Future Projections</text>
<text x="332" y="305.5" class="path" text-anchor="start">data/projections-future/</text>
<text x="332" y="321.0" class="sd" text-anchor="start">Weeks after the current one</text>
<rect x="320" y="341.0" width="246" height="61.0" rx="8" class="st"/>
<text x="332" y="361.0" class="stt" text-anchor="start">Stats</text>
<text x="332" y="378.5" class="path" text-anchor="start">data/stats/</text>
<text x="332" y="394.0" class="sd" text-anchor="start">Played weeks, kept forever</text>
<rect x="320" y="414.0" width="246" height="76.5" rx="8" class="st"/>
<text x="332" y="434.0" class="stt" text-anchor="start">NFL Schedule</text>
<text x="332" y="451.5" class="path" text-anchor="start">data/nfl/  +  data/nfl-live/</text>
<text x="332" y="467.0" class="sd" text-anchor="start">Kickoffs and finals; live clocks</text>
<text x="332" y="482.5" class="sd" text-anchor="start">in the rebuilt copy</text>
<rect x="320" y="502.5" width="246" height="76.5" rx="8" class="st rebuilt"/>
<text x="332" y="522.5" class="stt" text-anchor="start">Replacement Levels</text>
<text x="556" y="522.5" class="ref" text-anchor="end">Calc 14</text>
<text x="332" y="540.0" class="path" text-anchor="start">data/replacement/</text>
<text x="332" y="555.5" class="sd" text-anchor="start">Waiver-level points per position</text>
<text x="332" y="571.0" class="sd" text-anchor="start">and week, from free agents</text>
<rect x="320" y="591.0" width="246" height="76.5" rx="8" class="st rebuilt"/>
<text x="332" y="611.0" class="stt" text-anchor="start">Roster Drift Fit</text>
<text x="556" y="611.0" class="ref" text-anchor="end">Calc 6</text>
<text x="332" y="628.5" class="path" text-anchor="start">data/model/</text>
<text x="332" y="644.0" class="sd" text-anchor="start">How much of a team&#x27;s edge</text>
<text x="332" y="659.5" class="sd" text-anchor="start">survives k weeks ahead</text>
<rect x="612" y="64" width="290" height="641.5" rx="10" class="grp g3"/>
<text x="626" y="88" class="gl" text-anchor="start">3. HOW IT IS CALCULATED</text>
<text x="626" y="106" class="gs" text-anchor="start">In this order, every simulating run</text>
<rect x="624" y="122" width="266" height="61.0" rx="8" class="st"/>
<text x="636" y="142" class="stt" text-anchor="start">Fantasy Points</text>
<text x="880" y="142" class="ref" text-anchor="end">Calc 1</text>
<text x="636" y="159.5" class="sd" text-anchor="start">Each stat x what the league pays</text>
<text x="636" y="175.0" class="sd" text-anchor="start">for it, per league</text>
<rect x="624" y="201.0" width="266" height="76.5" rx="8" class="st rebuilt"/>
<text x="636" y="221.0" class="stt" text-anchor="start">Noise Pools</text>
<text x="880" y="221.0" class="ref" text-anchor="end">Calc 4</text>
<text x="636" y="238.5" class="sd" text-anchor="start">Actual minus projected points, by</text>
<text x="636" y="254.0" class="sd" text-anchor="start">position and projection band;</text>
<text x="636" y="269.5" class="sd" text-anchor="start">rebuilt in memory each run</text>
<path d="M757.0 184.0 V198.0" class="e" marker-end="url(#a)"/>
<rect x="624" y="295.5" width="266" height="61.0" rx="8" class="st"/>
<text x="636" y="315.5" class="stt" text-anchor="start">Best Lineup + Floor</text>
<text x="880" y="315.5" class="ref" text-anchor="end">Calc 5</text>
<text x="636" y="333.0" class="sd" text-anchor="start">Best projected starters; an empty</text>
<text x="636" y="348.5" class="sd" text-anchor="start">slot is worth replacement level</text>
<path d="M757.0 278.5 V292.5" class="e" marker-end="url(#a)"/>
<rect x="624" y="374.5" width="266" height="61.0" rx="8" class="st"/>
<text x="636" y="394.5" class="stt" text-anchor="start">Roster Drift</text>
<text x="880" y="394.5" class="ref" text-anchor="end">Calc 6</text>
<text x="636" y="412.0" class="sd" text-anchor="start">Shrinks each team&#x27;s edge and adds</text>
<text x="636" y="427.5" class="sd" text-anchor="start">spread the further ahead a week is</text>
<path d="M757.0 357.5 V371.5" class="e" marker-end="url(#a)"/>
<rect x="624" y="453.5" width="266" height="76.5" rx="8" class="st"/>
<text x="636" y="473.5" class="stt" text-anchor="start">Season Simulation</text>
<text x="880" y="473.5" class="ref" text-anchor="end">Calc 7, 8</text>
<text x="636" y="491.0" class="sd" text-anchor="start">The rest of the season 10,000 times:</text>
<text x="636" y="506.5" class="sd" text-anchor="start">score = projection + drawn miss;</text>
<text x="636" y="522.0" class="sd" text-anchor="start">standings, playoff and losers brackets</text>
<path d="M757.0 436.5 V450.5" class="e" marker-end="url(#a)"/>
<rect x="624" y="548.0" width="266" height="61.0" rx="8" class="st"/>
<text x="636" y="568.0" class="stt" text-anchor="start">Live Adjustment</text>
<text x="880" y="568.0" class="ref" text-anchor="end">Calc 12</text>
<text x="636" y="585.5" class="sd" text-anchor="start">In a game: points so far + projection</text>
<text x="636" y="601.0" class="sd" text-anchor="start">for the time left, spread shrinking</text>
<path d="M757.0 531.0 V545.0" class="e" marker-end="url(#a)"/>
<rect x="936" y="64" width="300" height="641.5" rx="10" class="grp g4"/>
<text x="950" y="88" class="gl" text-anchor="start">4. WHAT IT PRODUCES</text>
<text x="950" y="106" class="gs" text-anchor="start">Forecasts and where they are kept</text>
<rect x="948" y="122" width="276" height="92.0" rx="8" class="st"/>
<text x="960" y="142" class="stt" text-anchor="start">Forecast Outcomes</text>
<text x="1214" y="142" class="ref" text-anchor="end">Calc 9</text>
<text x="960" y="159.5" class="path" text-anchor="start">data/odds/&lt;league&gt;/&lt;season&gt;/</text>
<text x="960" y="175.0" class="sd" text-anchor="start">asof_NN.json: one per completed week</text>
<text x="960" y="190.5" class="sd" text-anchor="start">live.json: the current week (rebuilt)</text>
<text x="960" y="206.0" class="sd" text-anchor="start">slates_NN.json: after each slate</text>
<rect x="948" y="226.0" width="276" height="92.0" rx="8" class="st"/>
<text x="960" y="246.0" class="stt" text-anchor="start">Game Forecasts</text>
<text x="1214" y="246.0" class="ref" text-anchor="end">Calc 10</text>
<text x="960" y="263.5" class="path" text-anchor="start">data/games/  +  data/games-derived/</text>
<text x="960" y="279.0" class="sd" text-anchor="start">Win probability and scores per game;</text>
<text x="960" y="294.5" class="sd" text-anchor="start">a log frozen at kickoff and a</text>
<text x="960" y="310.0" class="sd" text-anchor="start">Forecast of record per final week</text>
<rect x="948" y="330.0" width="276" height="76.5" rx="8" class="st rebuilt"/>
<text x="960" y="350.0" class="stt" text-anchor="start">Lineup Views</text>
<text x="1214" y="350.0" class="ref" text-anchor="end">Calc 11</text>
<text x="960" y="367.5" class="path" text-anchor="start">data/games-derived/</text>
<text x="960" y="383.0" class="sd" text-anchor="start">Model lineup vs. the starters used;</text>
<text x="960" y="398.5" class="sd" text-anchor="start">lineup choices in points</text>
<rect x="948" y="418.5" width="276" height="76.5" rx="8" class="st rebuilt"/>
<text x="960" y="438.5" class="stt" text-anchor="start">Win Probability Added</text>
<text x="1214" y="438.5" class="ref" text-anchor="end">Calc 13</text>
<text x="960" y="456.0" class="path" text-anchor="start">data/games-derived/</text>
<text x="960" y="471.5" class="sd" text-anchor="start">How far each player&#x27;s score moved</text>
<text x="960" y="487.0" class="sd" text-anchor="start">the team&#x27;s win probability</text>
<rect x="948" y="507.0" width="276" height="92.0" rx="8" class="st rebuilt"/>
<text x="960" y="527.0" class="stt" text-anchor="start">Live Bundle</text>
<text x="960" y="544.5" class="path" text-anchor="start">Cloudflare KV (relay)</text>
<text x="960" y="560.0" class="sd" text-anchor="start">The hot run&#x27;s current-week Forecast</text>
<text x="960" y="575.5" class="sd" text-anchor="start">and game cards, every 15 min or</text>
<text x="960" y="591.0" class="sd" text-anchor="start">back to back during games</text>
<rect x="948" y="611.0" width="276" height="76.5" rx="8" class="st"/>
<text x="960" y="631.0" class="stt" text-anchor="start">Calibration</text>
<text x="1214" y="631.0" class="ref" text-anchor="end">Calc 18</text>
<text x="960" y="648.5" class="path" text-anchor="start">data/calibration/</text>
<text x="960" y="664.0" class="sd" text-anchor="start">Every finished season replayed; run</text>
<text x="960" y="679.5" class="sd" text-anchor="start">on demand (python -m ffapp calibrate)</text>
<rect x="1270" y="64" width="280" height="641.5" rx="10" class="grp g5"/>
<text x="1284" y="88" class="gl" text-anchor="start">5. WHERE IT SHOWS</text>
<text x="1284" y="106" class="gs" text-anchor="start">fantasyfoosball.net</text>
<rect x="1282" y="122" width="256" height="92.0" rx="8" class="st"/>
<text x="1294" y="142" class="stt" text-anchor="start">Forecasts Page</text>
<text x="1294" y="159.5" class="sd" text-anchor="start">Probability of the playoffs, a bye,</text>
<text x="1294" y="175.0" class="sd" text-anchor="start">the final, the title and the losers</text>
<text x="1294" y="190.5" class="sd" text-anchor="start">bracket; projected record; weekly</text>
<text x="1294" y="206.0" class="sd" text-anchor="start">history chart</text>
<rect x="1282" y="226.0" width="256" height="92.0" rx="8" class="st"/>
<text x="1294" y="246.0" class="stt" text-anchor="start">Games Page</text>
<text x="1294" y="263.5" class="sd" text-anchor="start">Win probability, projected scores</text>
<text x="1294" y="279.0" class="sd" text-anchor="start">and score spread per game; Model |</text>
<text x="1294" y="294.5" class="sd" text-anchor="start">Actual lineups, lineup choices and</text>
<text x="1294" y="310.0" class="sd" text-anchor="start">WPA tags; live swaps from the bundle</text>
<rect x="1282" y="330.0" width="256" height="76.5" rx="8" class="st"/>
<text x="1294" y="350.0" class="stt" text-anchor="start">Managers Page</text>
<text x="1294" y="367.5" class="sd" text-anchor="start">Team News: a story when a team&#x27;s</text>
<text x="1294" y="383.0" class="sd" text-anchor="start">playoff probability moves sharply</text>
<text x="1294" y="398.5" class="sd" text-anchor="start">between weeks</text>
<rect x="1282" y="418.5" width="256" height="76.5" rx="8" class="st"/>
<text x="1294" y="438.5" class="stt" text-anchor="start">Calibration Page</text>
<text x="1294" y="456.0" class="sd" text-anchor="start">How often results landed inside</text>
<text x="1294" y="471.5" class="sd" text-anchor="start">the Forecast ranges, by season,</text>
<text x="1294" y="487.0" class="sd" text-anchor="start">game and score</text>
<path d="M277 384.75 H304" class="e" marker-end="url(#a)"/>
<path d="M581 384.75 H608" class="e" marker-end="url(#a)"/>
<path d="M905 384.75 H932" class="e" marker-end="url(#a)"/>
<path d="M1239 384.75 H1266" class="e" marker-end="url(#a)"/>
<rect x="26" y="724.5" width="22" height="13" rx="3" class="st"/>
<text x="56" y="735.5" class="lg" text-anchor="start">Record: committed to git, kept forever</text>
<rect x="366" y="724.5" width="22" height="13" rx="3" class="st rebuilt"/>
<text x="396" y="735.5" class="lg" text-anchor="start">Rebuilt by each run (build cache, deployed site or relay), never committed</text>
<text x="1550" y="735.5" class="ref" text-anchor="end">Calc N = section N of Calculations.txt</text>
<text x="24" y="761.5" class="lg"><tspan class="lgn">Cold run:</tspan> every 15 min in season, daily off-season: every calculation, commits changed records, deploys the site</text>
<text x="24" y="785.5" class="lg"><tspan class="lgn">Hot run:</tspan> current week only: Live Adjustment and Game Forecasts into the live bundle; never commits</text>
<text x="24" y="809.5" class="lg"><tspan class="lgn">Calibration:</tspan> on demand: replays every finished season through the same simulation</text>
</svg>