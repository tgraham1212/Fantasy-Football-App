<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4110 592" width="4110" height="592">
<style>
text { font-family: 'Segoe UI', system-ui, sans-serif; }
.bg { fill: #ffffff; }
.title { font-size: 20px; font-weight: 700; fill: #14161a; }
.sub { font-size: 12.5px; fill: #4c5058; }
.col { font-size: 11.5px; font-weight: 700; fill: #6b6f78; letter-spacing: 0.08em; }
.req { fill: #ffffff; stroke: #2b2f36; stroke-width: 1.4; }
.need { fill: #fbf2e1; stroke: #c08a2c; stroke-width: 1.6; }
.ext { fill: #f4f4f2; stroke: #9a9890; stroke-width: 1.2; stroke-dasharray: 4 3; }
.hdr { fill: #eef1f6; } .needhdr { fill: #f5e2bd; } .exthdr { fill: #e9e8e4; }
.ster { font-size: 10.5px; fill: #4c5058; font-style: italic; }
.rid { font-size: 12.5px; font-weight: 800; fill: #14161a; font-family: ui-monospace, Consolas, monospace; }
.rname { font-size: 12.5px; font-weight: 700; fill: #14161a; }
.rtext { font-size: 11px; fill: #2b2f36; }
.spec { font-size: 10.5px; fill: #3c67a8; font-family: ui-monospace, Consolas, monospace; }
.tc { fill: #e8f5ea; stroke: #4f9a5c; stroke-width: 1.3; }
.insp { fill: #e8f0fb; stroke: #4f7cc0; stroke-width: 1.3; }
.anal { fill: #f1ecfa; stroke: #8a6fc0; stroke-width: 1.3; }
.gap { fill: #fdecec; stroke: #c0392b; stroke-width: 1.3; stroke-dasharray: 5 3; }
.none { fill: #fdecec; stroke: #c0392b; stroke-width: 1.3; }
.tctext { font-size: 10.5px; fill: #14161a; font-family: ui-monospace, Consolas, monospace; }
.tbr { fill: #b4530b; } .tbrt { font-size: 10px; font-weight: 800; fill: #ffffff; }
.derive { fill: none; stroke: #2b2f36; stroke-width: 1.4; stroke-dasharray: 6 3; }
.trace { fill: none; stroke: #8a8880; stroke-width: 1.4; stroke-dasharray: 2 3; }
.verify { fill: none; stroke: #4f9a5c; stroke-width: 1.3; stroke-dasharray: 6 3; }
.vgap { fill: none; stroke: #c0392b; stroke-width: 1.3; stroke-dasharray: 6 3; }
.elab { font-size: 10px; fill: #4c5058; font-style: italic; }
.lg { font-size: 11.5px; fill: #2b2f36; }
.nnum { font-size: 22px; font-weight: 800; fill: #b4530b; font-family: ui-monospace, Consolas, monospace; }
.nname { font-size: 14px; font-weight: 700; fill: #14161a; }
.stat { font-size: 11.5px; fill: #2b2f36; } .statn { font-weight: 800; } .gapn { font-weight: 800; fill: #c0392b; }
.bt { fill: #4f9a5c; } .bi { fill: #4f7cc0; } .ba { fill: #8a6fc0; } .bd { fill: #2fa3a3; } .bgp { fill: #c0392b; } .bempty { fill: #e4e2dc; }
</style>
<defs><marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#2b2f36" stroke-width="1.4"/></marker><marker id="openg" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#8a8880" stroke-width="1.4"/></marker><marker id="openv" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#4f9a5c" stroke-width="1.4"/></marker><marker id="openr" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#c0392b" stroke-width="1.4"/></marker></defs>
<rect class="bg" width="4110" height="592"/>
<text class="title" x="40" y="44">Requirements Diagram: Need 6, Durable Record</text>
<text class="sub" x="40" y="66">0 requirements derived from need 6 · drawn from the specs by tools/requirements_diagram.py · level = number of dots in the ID</text>
<text class="col" x="40" y="132">NEED · LEVEL 0</text>
<text class="sub" x="350" y="210">No requirement traces to this need yet.</text>
<rect class="need" x="40" y="150" width="260" height="118" rx="3"/>
<rect class="needhdr" x="40.7" y="150.7" width="258.6" height="34" rx="2.5"/>
<text class="ster" x="170.0" y="163" text-anchor="middle">«need»</text>
<text x="170.0" y="178" text-anchor="middle"><tspan class="rid">6</tspan><tspan class="rname" dx="6">Durable Record</tspan></text>
<text class="rtext" x="48" y="200">The project SHALL keep a complete, lasting</text>
<text class="rtext" x="48" y="214">copy of each league&#x27;s history and of the</text>
<text class="rtext" x="48" y="228">Player data the Forecasts use, so every past</text>
<text class="rtext" x="48" y="242">figure can be reproduced without Sleeper or…</text>
<text class="spec" x="48" y="261">needs</text>
<text class="col" x="40" y="318">OTHER BRANCHES · «trace» (extra parents)</text>
<rect class="ext" x="350" y="334" width="260" height="118" rx="3"/>
<rect class="exthdr" x="350.7" y="334.7" width="258.6" height="34" rx="2.5"/>
<text class="ster" x="480.0" y="347" text-anchor="middle">«requirement»</text>
<text x="480.0" y="362" text-anchor="middle"><tspan class="rid">2.4</tspan><tspan class="rname" dx="6">Forecast log</tspan></text>
<text class="rtext" x="358" y="384">Each cold run SHALL append, for each game of</text>
<text class="rtext" x="358" y="398">the current week, an entry holding the run</text>
<text class="rtext" x="358" y="412">time, each team&#x27;s model lineup and win</text>
<text class="rtext" x="358" y="426">probability, and every rostered Player&#x27;s…</text>
<text class="spec" x="358" y="445">game-predictions</text>
<path class="trace" d="M480.0,334 V276 H150.0 V268" marker-end="url(#openg)"/>
<rect class="ext" x="660" y="334" width="260" height="118" rx="3"/>
<rect class="exthdr" x="660.7" y="334.7" width="258.6" height="34" rx="2.5"/>
<text class="ster" x="790.0" y="347" text-anchor="middle">«requirement»</text>
<text x="790.0" y="362" text-anchor="middle"><tspan class="rid">2.6</tspan><tspan class="rname" dx="6">Game files committed</tspan></text>
<text class="rtext" x="668" y="384">The system SHALL commit, per league, season</text>
<text class="rtext" x="668" y="398">and week, the log entries and, once the week</text>
<text class="rtext" x="668" y="412">is final, the Forecast of record with each</text>
<text class="rtext" x="668" y="426">team&#x27;s actual score and the winner.</text>
<text class="spec" x="668" y="445">game-predictions</text>
<path class="trace" d="M790.0,334 V281 H150.0 V268" marker-end="url(#openg)"/>
<rect class="ext" x="970" y="334" width="260" height="118" rx="3"/>
<rect class="exthdr" x="970.7" y="334.7" width="258.6" height="34" rx="2.5"/>
<text class="ster" x="1100.0" y="347" text-anchor="middle">«requirement»</text>
<text x="1100.0" y="362" text-anchor="middle"><tspan class="rid">1.2.5.1</tspan><tspan class="rname" dx="6">Slate Forecast kept</tspan></text>
<text class="rtext" x="978" y="384">A stored slate Forecast SHALL stay as first</text>
<text class="rtext" x="978" y="398">stored.</text>
<text class="spec" x="978" y="445">game-predictions</text>
<path class="trace" d="M1100.0,334 V286 H150.0 V268" marker-end="url(#openg)"/>
<rect class="ext" x="1280" y="334" width="260" height="118" rx="3"/>
<rect class="exthdr" x="1280.7" y="334.7" width="258.6" height="34" rx="2.5"/>
<text class="ster" x="1410.0" y="347" text-anchor="middle">«requirement»</text>
<text x="1410.0" y="362" text-anchor="middle"><tspan class="rid">5.2.2</tspan><tspan class="rname" dx="6">Hot run inputs</tspan></text>
<text class="rtext" x="1288" y="384">A hot run SHALL start from the committed</text>
<text class="rtext" x="1288" y="398">records plus the latest cold run&#x27;s build</text>
<text class="rtext" x="1288" y="412">cache, rebuilding the derived data offline</text>
<text class="rtext" x="1288" y="426">when no cache exists.</text>
<text class="spec" x="1288" y="445">live-refresh</text>
<path class="trace" d="M1410.0,334 V276 H150.0 V268" marker-end="url(#openg)"/>
<rect class="ext" x="1590" y="334" width="260" height="118" rx="3"/>
<rect class="exthdr" x="1590.7" y="334.7" width="258.6" height="34" rx="2.5"/>
<text class="ster" x="1720.0" y="347" text-anchor="middle">«requirement»</text>
<text x="1720.0" y="362" text-anchor="middle"><tspan class="rid">4.6.9</tspan><tspan class="rname" dx="6">Ratings file</tspan></text>
<text class="rtext" x="1598" y="384">The ratings command SHALL write one file per</text>
<text class="rtext" x="1598" y="398">configured league holding, for every Manager,</text>
<text class="rtext" x="1598" y="412">their identity, display name and current or</text>
<text class="rtext" x="1598" y="426">former status, and a per-week history of…</text>
<text class="spec" x="1598" y="445">manager-ratings</text>
<path class="trace" d="M1720.0,334 V281 H150.0 V268" marker-end="url(#openg)"/>
<rect class="ext" x="1900" y="334" width="260" height="118" rx="3"/>
<rect class="exthdr" x="1900.7" y="334.7" width="258.6" height="34" rx="2.5"/>
<text class="ster" x="2030.0" y="347" text-anchor="middle">«requirement»</text>
<text x="2030.0" y="362" text-anchor="middle"><tspan class="rid">3.3.8</tspan><tspan class="rname" dx="6">WAR stored</tspan></text>
<text class="rtext" x="1908" y="384">The system SHALL write, per league and season,</text>
<text class="rtext" x="1908" y="398">a file holding the cut, the week it runs</text>
<text class="rtext" x="1908" y="412">through, the season constants and replacement</text>
<text class="rtext" x="1908" y="426">levels, and per qualifying Player his Sleep…</text>
<text class="spec" x="1908" y="445">player-war</text>
<path class="trace" d="M2030.0,334 V286 H150.0 V268" marker-end="url(#openg)"/>
<rect class="ext" x="2210" y="334" width="260" height="118" rx="3"/>
<rect class="exthdr" x="2210.7" y="334.7" width="258.6" height="34" rx="2.5"/>
<text class="ster" x="2340.0" y="347" text-anchor="middle">«requirement»</text>
<text x="2340.0" y="362" text-anchor="middle"><tspan class="rid">1.1.10</tspan><tspan class="rname" dx="6">Repeatability</tspan></text>
<text class="rtext" x="2218" y="384">Given the same stored data and random seed,</text>
<text class="rtext" x="2218" y="398">the simulation SHALL produce identical</text>
<text class="rtext" x="2218" y="412">results.</text>
<text class="spec" x="2218" y="445">playoff-odds-simulation</text>
<path class="trace" d="M2340.0,334 V276 H150.0 V268" marker-end="url(#openg)"/>
<rect class="ext" x="2520" y="334" width="260" height="118" rx="3"/>
<rect class="exthdr" x="2520.7" y="334.7" width="258.6" height="34" rx="2.5"/>
<text class="ster" x="2650.0" y="347" text-anchor="middle">«requirement»</text>
<text x="2650.0" y="362" text-anchor="middle"><tspan class="rid">1.2</tspan><tspan class="rname" dx="6">Forecast history</tspan></text>
<text class="rtext" x="2528" y="384">Each as-of Forecast SHALL be stored by league,</text>
<text class="rtext" x="2528" y="398">season and as-of week, for current and</text>
<text class="rtext" x="2528" y="412">replayed seasons alike, keeping every other</text>
<text class="rtext" x="2528" y="426">week&#x27;s and season&#x27;s Forecast.</text>
<text class="spec" x="2528" y="445">playoff-odds-simulation</text>
<path class="trace" d="M2650.0,334 V281 H150.0 V268" marker-end="url(#openg)"/>
<rect class="ext" x="2830" y="334" width="260" height="118" rx="3"/>
<rect class="exthdr" x="2830.7" y="334.7" width="258.6" height="34" rx="2.5"/>
<text class="ster" x="2960.0" y="347" text-anchor="middle">«requirement»</text>
<text x="2960.0" y="362" text-anchor="middle"><tspan class="rid">5.5</tspan><tspan class="rname" dx="6">Cold run</tspan></text>
<text class="rtext" x="2838" y="384">Each cold run SHALL update the league data,</text>
<text class="rtext" x="2838" y="398">Projections, stats, NFL schedule, injury</text>
<text class="rtext" x="2838" y="412">statuses and start-percentage snapshot, then</text>
<text class="rtext" x="2838" y="426">rebuild the ratings, replacement levels, WA…</text>
<text class="spec" x="2838" y="445">refresh-scheduling</text>
<path class="trace" d="M2960.0,334 V286 H150.0 V268" marker-end="url(#openg)"/>
<rect class="ext" x="3140" y="334" width="260" height="118" rx="3"/>
<rect class="exthdr" x="3140.7" y="334.7" width="258.6" height="34" rx="2.5"/>
<text class="ster" x="3270.0" y="347" text-anchor="middle">«requirement»</text>
<text x="3270.0" y="362" text-anchor="middle"><tspan class="rid">5.5.3</tspan><tspan class="rname" dx="6">Failed step</tspan></text>
<text class="rtext" x="3148" y="384">A failed required step SHALL stop the cold run</text>
<text class="rtext" x="3148" y="398">before it commits or deploys, leaving the</text>
<text class="rtext" x="3148" y="412">stored data and the published site unchanged</text>
<text class="rtext" x="3148" y="426">and the run marked failed.</text>
<text class="spec" x="3148" y="445">refresh-scheduling</text>
<path class="trace" d="M3270.0,334 V276 H150.0 V268" marker-end="url(#openg)"/>
<rect class="ext" x="3450" y="334" width="260" height="118" rx="3"/>
<rect class="exthdr" x="3450.7" y="334.7" width="258.6" height="34" rx="2.5"/>
<text class="ster" x="3580.0" y="347" text-anchor="middle">«requirement»</text>
<text x="3580.0" y="362" text-anchor="middle"><tspan class="rid">3.5.5</tspan><tspan class="rname" dx="6">Replacement levels stored</tspan></text>
<text class="rtext" x="3458" y="384">The system SHALL write, per league and season,</text>
<text class="rtext" x="3458" y="398">data/replacement/&lt;league&gt;/&lt;season&gt;.json</text>
<text class="rtext" x="3458" y="412">holding the weekly projected and realised</text>
<text class="rtext" x="3458" y="426">levels by position, the season values, the …</text>
<text class="spec" x="3458" y="445">replacement-level</text>
<path class="trace" d="M3580.0,334 V281 H150.0 V268" marker-end="url(#openg)"/>
<rect class="ext" x="3760" y="334" width="260" height="118" rx="3"/>
<rect class="exthdr" x="3760.7" y="334.7" width="258.6" height="34" rx="2.5"/>
<text class="ster" x="3890.0" y="347" text-anchor="middle">«requirement»</text>
<text x="3890.0" y="362" text-anchor="middle"><tspan class="rid">4.7.19</tspan><tspan class="rname" dx="6">Trending adds saved</tspan></text>
<text class="rtext" x="3768" y="384">Each cold run SHALL save Sleeper&#x27;s trending</text>
<text class="rtext" x="3768" y="398">adds, the most-added Players over the last 24</text>
<text class="rtext" x="3768" y="412">hours, with the time saved.</text>
<text class="spec" x="3768" y="445">team-news</text>
<path class="trace" d="M3890.0,334 V286 H150.0 V268" marker-end="url(#openg)"/>
