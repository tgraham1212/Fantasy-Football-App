<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1604 555.0" width="1604" height="555.0" role="img" aria-labelledby="sos-t" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<style>
.grp { stroke-width: 1.5; } .g1 { fill: #efeeeb; stroke: #8c8a84; } .g2 { fill: #eef1f6; stroke: #93a0b8; }
.g3 { fill: #fbf2e1; stroke: #c08a2c; } .g4 { fill: #e8f0fb; stroke: #4f7cc0; } .g5 { fill: #e8f5ea; stroke: #4f9a5c; }
.gl { font-weight: 700; font-size: 13px; letter-spacing: 0.06em; fill: #4c5058; }
.gs { font-size: 11.5px; fill: #4c5058; }
.st { fill: #ffffff; stroke: #2b2f36; stroke-width: 1.4; } .st.rebuilt { stroke-dasharray: 5 3; }
.stt { font-weight: 700; font-size: 12.5px; fill: #14161a; } .sd { font-size: 11.5px; fill: #4c5058; }
.ref { font-size: 10.5px; font-weight: 700; fill: #b4530b; font-family: ui-monospace, Consolas, monospace; }
.path { font-size: 11px; fill: #2b2f36; font-family: ui-monospace, Consolas, monospace; }
.e { fill: none; stroke: #2b2f36; stroke-width: 1.5; } .ah { fill: #2b2f36; }
.lg { font-size: 12.5px; fill: #2b2f36; } .lgn { font-weight: 800; }
</style>
<rect width="1604" height="555.0" fill="#ffffff"/>
<title id="sos-t">How Strength of Schedule is made: its sources, where the data is stored, the calculations in order, the schedule file and the page that shows it</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs>
<text x="24" y="34" class="gl" text-anchor="start">HOW STRENGTH OF SCHEDULE IS MADE</text>
<rect x="24" y="64" width="250" height="363.0" rx="10" class="grp g1"/>
<text x="38" y="88" class="gl" text-anchor="start">1. WHERE IT COMES FROM</text>
<text x="38" y="106" class="gs" text-anchor="start">Fetched by each cold run</text>
<rect x="36" y="122" width="226" height="76.5" rx="8" class="st"/>
<text x="48" y="142" class="stt" text-anchor="start">Sleeper: League Data</text>
<text x="48" y="159.5" class="sd" text-anchor="start">Matchups: each team&#x27;s points and</text>
<text x="48" y="175.0" class="sd" text-anchor="start">opponent every week; league settings</text>
<text x="48" y="190.5" class="sd" text-anchor="start">(regular-season weeks)</text>
<rect x="36" y="210.5" width="226" height="61.0" rx="8" class="st"/>
<text x="48" y="230.5" class="stt" text-anchor="start">Season Simulation</text>
<text x="252" y="230.5" class="ref" text-anchor="end">Calc 7, 9</text>
<text x="48" y="248.0" class="sd" text-anchor="start">Each cold run&#x27;s Forecast: every team&#x27;s</text>
<text x="48" y="263.5" class="sd" text-anchor="start">simulated score in upcoming weeks</text>
<rect x="308" y="64" width="270" height="363.0" rx="10" class="grp g2"/>
<text x="322" y="88" class="gl" text-anchor="start">2. WHERE IT IS STORED</text>
<text x="322" y="106" class="gs" text-anchor="start">Records in git; rebuilt files in the build cache</text>
<rect x="320" y="122" width="246" height="61.0" rx="8" class="st"/>
<text x="332" y="142" class="stt" text-anchor="start">League Data</text>
<text x="332" y="159.5" class="path" text-anchor="start">data/leagues/</text>
<text x="332" y="175.0" class="sd" text-anchor="start">One folder per league and season</text>
<rect x="320" y="195.0" width="246" height="92.0" rx="8" class="st"/>
<text x="332" y="215.0" class="stt" text-anchor="start">Season Forecasts</text>
<text x="556" y="215.0" class="ref" text-anchor="end">Calc 9</text>
<text x="332" y="232.5" class="path" text-anchor="start">data/odds/&lt;league&gt;/&lt;season&gt;/</text>
<text x="332" y="248.0" class="sd" text-anchor="start">asof_NN.json and live.json, with each</text>
<text x="332" y="263.5" class="sd" text-anchor="start">upcoming week&#x27;s mean scores and every</text>
<text x="332" y="279.0" class="sd" text-anchor="start">pair&#x27;s win share</text>
<rect x="612" y="64" width="290" height="363.0" rx="10" class="grp g3"/>
<text x="626" y="88" class="gl" text-anchor="start">3. HOW IT IS CALCULATED</text>
<text x="626" y="106" class="gs" text-anchor="start">In this order, every build</text>
<rect x="624" y="122" width="266" height="76.5" rx="8" class="st"/>
<text x="636" y="142" class="stt" text-anchor="start">Weeks</text>
<text x="880" y="142" class="ref" text-anchor="end">Calc 24</text>
<text x="636" y="159.5" class="sd" text-anchor="start">Regular season only; played weeks from</text>
<text x="636" y="175.0" class="sd" text-anchor="start">the matchups, upcoming weeks (and one</text>
<text x="636" y="190.5" class="sd" text-anchor="start">in progress) from the latest Forecast</text>
<rect x="624" y="216.5" width="266" height="76.5" rx="8" class="st"/>
<text x="636" y="236.5" class="stt" text-anchor="start">Weekly Ranks</text>
<text x="880" y="236.5" class="ref" text-anchor="end">Calc 24</text>
<text x="636" y="254.0" class="sd" text-anchor="start">Rank every team by points each week;</text>
<text x="636" y="269.5" class="sd" text-anchor="start">average the opponents&#x27; ranks over</text>
<text x="636" y="285.0" class="sd" text-anchor="start">played, upcoming and all weeks</text>
<path d="M757.0 199.5 V213.5" class="e" marker-end="url(#a)"/>
<rect x="624" y="311.0" width="266" height="92.0" rx="8" class="st"/>
<text x="636" y="331.0" class="stt" text-anchor="start">Schedule Swap</text>
<text x="880" y="331.0" class="ref" text-anchor="end">Calc 24</text>
<text x="636" y="348.5" class="sd" text-anchor="start">Each Manager&#x27;s scores against every</text>
<text x="636" y="364.0" class="sd" text-anchor="start">schedule (substituting when it meets</text>
<text x="636" y="379.5" class="sd" text-anchor="start">them); upcoming games at win shares;</text>
<text x="636" y="395.0" class="sd" text-anchor="start">Index = average wins - own wins</text>
<path d="M757.0 294.0 V308.0" class="e" marker-end="url(#a)"/>
<rect x="936" y="64" width="310" height="363.0" rx="10" class="grp g4"/>
<text x="950" y="88" class="gl" text-anchor="start">4. WHAT IT PRODUCES</text>
<text x="950" y="106" class="gs" text-anchor="start">Derived data, deployed with the site</text>
<rect x="948" y="122" width="286" height="76.5" rx="8" class="st rebuilt"/>
<text x="960" y="142" class="stt" text-anchor="start">Strength of Schedule File</text>
<text x="1224" y="142" class="ref" text-anchor="end">Calc 24</text>
<text x="960" y="159.5" class="path" text-anchor="start">site/data/&lt;league&gt;/schedule.json</text>
<text x="960" y="175.0" class="sd" text-anchor="start">Every stored season&#x27;s Weekly Ranks</text>
<text x="960" y="190.5" class="sd" text-anchor="start">and Schedule Swap, one file per league</text>
<rect x="1280" y="64" width="300" height="363.0" rx="10" class="grp g5"/>
<text x="1294" y="88" class="gl" text-anchor="start">5. WHERE IT SHOWS</text>
<text x="1294" y="106" class="gs" text-anchor="start">fantasyfoosball.net</text>
<rect x="1292" y="122" width="276" height="107.5" rx="8" class="st"/>
<text x="1304" y="142" class="stt" text-anchor="start">League Page: Strength of Schedule</text>
<text x="1304" y="159.5" class="sd" text-anchor="start">Weekly Ranks: opponent rank per</text>
<text x="1304" y="175.0" class="sd" text-anchor="start">week, played faded, forecast solid</text>
<text x="1304" y="190.5" class="sd" text-anchor="start">Schedule Swap: wins under every</text>
<text x="1304" y="206.0" class="sd" text-anchor="start">schedule, Index and range</text>
<text x="1304" y="221.5" class="sd" text-anchor="start">Season selector; Manager pinned on phones</text>
<path d="M277 245.5 H304" class="e" marker-end="url(#a)"/>
<path d="M581 245.5 H608" class="e" marker-end="url(#a)"/>
<path d="M905 245.5 H932" class="e" marker-end="url(#a)"/>
<path d="M1249 245.5 H1276" class="e" marker-end="url(#a)"/>
<rect x="26" y="446.0" width="22" height="13" rx="3" class="st"/>
<text x="56" y="457.0" class="lg" text-anchor="start">Record: committed to git, kept forever</text>
<rect x="366" y="446.0" width="22" height="13" rx="3" class="st rebuilt"/>
<text x="396" y="457.0" class="lg" text-anchor="start">Rebuilt by each run (build cache, deployed site or relay), never committed</text>
<text x="1580" y="457.0" class="ref" text-anchor="end">Calc N = section N of Calculations.txt</text>
<text x="24" y="483.0" class="lg"><tspan class="lgn">Build:</tspan> python -m ffapp build (and every cold run&#x27;s export) writes the schedule file from the stored data</text>
<text x="24" y="507.0" class="lg"><tspan class="lgn">Records:</tspan> the stored league data and season Forecasts are records; the schedule file is derived data</text>
</svg>