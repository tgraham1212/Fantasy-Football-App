<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1392 856" width="1392" height="856" role="img" aria-labelledby="rm-t" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<style>
.grp-off { fill: #efeeeb; stroke: #8c8a84; } .grp-quiet { fill: #eef1f6; stroke: #93a0b8; }
.grp-live { fill: #e8f5ea; stroke: #4f9a5c; } .grp-hot { fill: #fbf2e1; stroke: #c08a2c; }
.grp-cold { fill: #e8f0fb; stroke: #4f7cc0; } .grp { stroke-width: 1.5; }
.gl { font-weight: 700; font-size: 13px; letter-spacing: 0.06em; fill: #4c5058; }
.st { fill: #ffffff; stroke: #2b2f36; stroke-width: 1.4; }
.mt { font-weight: 800; font-size: 15px; fill: #14161a; } .mc { font-size: 12px; fill: #4c5058; font-family: ui-monospace, Consolas, monospace; }
.k { font-weight: 700; font-size: 12.5px; fill: #14161a; } .v { font-size: 12.5px; fill: #2b2f36; }
.stt { font-weight: 700; font-size: 12.5px; fill: #14161a; } .sd { font-size: 11.5px; fill: #4c5058; }
.e { fill: none; stroke: #2b2f36; stroke-width: 1.5; } .e.dash { stroke: #b4530b; stroke-dasharray: 6 4; stroke-width: 1.6; }
.bd { fill: #ffffff; stroke: #2b2f36; stroke-width: 1.2; }
.bt { font-size: 10.5px; font-weight: 800; fill: #14161a; text-anchor: middle; dominant-baseline: central; }
.lg { font-size: 12.5px; fill: #2b2f36; } .lgn { font-weight: 800; }
.note { font-size: 12px; fill: #4c5058; font-style: italic; } .dl { font-size: 11.5px; fill: #b4530b; font-weight: 700; }
.ah { fill: #2b2f36; } .ah-s { fill: #b4530b; }
</style>
<rect width="1392" height="856" fill="#ffffff"/>
<title id="rm-t">Refresh modes: off-season, quiet and live, with their transitions, and the steps of one hot run and one cold run</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah-s"/></marker></defs>
<text x="24" y="32" class="gl" text-anchor="start">REFRESH MODES</text>
<rect x="24" y="84" width="400" height="262" rx="10" class="grp grp-off"/>
<text x="40" y="112" class="mt" text-anchor="start">Off-season</text>
<text x="408" y="112" class="mc" text-anchor="end">offseason</text>
<text x="40" y="140" class="k" text-anchor="start">When</text>
<text x="108" y="140" class="v" text-anchor="start">Both leagues&#x27; seasons are over, until the</text>
<text x="108" y="157" class="v" text-anchor="start">next NFL season&#x27;s week 1</text>
<text x="40" y="183" class="k" text-anchor="start">Hot</text>
<text x="108" y="183" class="v" text-anchor="start">Off</text>
<text x="40" y="209" class="k" text-anchor="start">Cold</text>
<text x="108" y="209" class="v" text-anchor="start">Daily at 11:00 UTC</text>
<text x="40" y="235" class="k" text-anchor="start">Button</text>
<text x="108" y="235" class="v" text-anchor="start">Starts a cold run</text>
<text x="40" y="261" class="k" text-anchor="start">Page</text>
<text x="108" y="261" class="v" text-anchor="start">Static files only</text>
<rect x="496" y="84" width="400" height="262" rx="10" class="grp grp-quiet"/>
<text x="512" y="112" class="mt" text-anchor="start">Quiet</text>
<text x="880" y="112" class="mc" text-anchor="end">quiet</text>
<text x="512" y="140" class="k" text-anchor="start">When</text>
<text x="580" y="140" class="v" text-anchor="start">In season, no NFL game in progress</text>
<text x="512" y="166" class="k" text-anchor="start">Hot</text>
<text x="580" y="166" class="v" text-anchor="start">Every 15 min: current-week forecast</text>
<text x="580" y="183" class="v" text-anchor="start">and game cards</text>
<text x="512" y="209" class="k" text-anchor="start">Cold</text>
<text x="580" y="209" class="v" text-anchor="start">Every 15 min; commits and deploys</text>
<text x="580" y="226" class="v" text-anchor="start">only when something changed</text>
<text x="512" y="252" class="k" text-anchor="start">Button</text>
<text x="580" y="252" class="v" text-anchor="start">Starts a hot run and a cold run</text>
<text x="512" y="278" class="k" text-anchor="start">Page</text>
<text x="580" y="278" class="v" text-anchor="start">Newer of the live bundle and static files</text>
<rect x="968" y="84" width="400" height="262" rx="10" class="grp grp-live"/>
<text x="984" y="112" class="mt" text-anchor="start">Live</text>
<text x="1352" y="112" class="mc" text-anchor="end">live</text>
<text x="984" y="140" class="k" text-anchor="start">When</text>
<text x="1052" y="140" class="v" text-anchor="start">An NFL game has kicked off and is not final</text>
<text x="984" y="166" class="k" text-anchor="start">Hot</text>
<text x="1052" y="166" class="v" text-anchor="start">Back to back: the clock starts one each</text>
<text x="1052" y="183" class="v" text-anchor="start">minute when none is running (1-1.5 min)</text>
<text x="984" y="209" class="k" text-anchor="start">Cold</text>
<text x="1052" y="209" class="v" text-anchor="start">Every 15 min, no simulation; commits</text>
<text x="1052" y="226" class="v" text-anchor="start">only when a record changed</text>
<text x="984" y="252" class="k" text-anchor="start">Button</text>
<text x="1052" y="252" class="v" text-anchor="start">Held: live updates are already on</text>
<text x="984" y="278" class="k" text-anchor="start">Page</text>
<text x="1052" y="278" class="v" text-anchor="start">Live bundle, checked every 30 s</text>
<path d="M426 154 H493" class="e" marker-end="url(#a)"/>
<circle cx="460.0" cy="136" r="11" class="bd"/><text x="460.0" y="136" class="bt">1</text>
<path d="M494 284 H427" class="e" marker-end="url(#a)"/>
<circle cx="460.0" cy="266" r="11" class="bd"/><text x="460.0" y="266" class="bt">4</text>
<path d="M898 154 H965" class="e" marker-end="url(#a)"/>
<circle cx="932.0" cy="136" r="11" class="bd"/><text x="932.0" y="136" class="bt">2</text>
<path d="M966 284 H899" class="e" marker-end="url(#a)"/>
<circle cx="932.0" cy="266" r="11" class="bd"/><text x="932.0" y="266" class="bt">3</text>
<path d="M1118 82 C1138 38 1218 38 1238 81" class="e" marker-end="url(#a)"/>
<circle cx="1178" cy="48" r="11" class="bd"/><text x="1178" y="48" class="bt">5</text>
<circle cx="35" cy="376" r="11" class="bd"/><text x="35" y="376" class="bt">1</text>
<text x="54" y="380" class="lg"><tspan class="lgn">Off-season to Quiet:</tspan> the NFL season&#x27;s week 1 begins (Sleeper&#x27;s NFL state)</text>
<circle cx="35" cy="400" r="11" class="bd"/><text x="35" y="400" class="bt">2</text>
<text x="54" y="404" class="lg"><tspan class="lgn">Quiet to Live:</tspan> a game&#x27;s kickoff time passes</text>
<circle cx="35" cy="424" r="11" class="bd"/><text x="35" y="424" class="bt">3</text>
<text x="54" y="428" class="lg"><tspan class="lgn">Live to Quiet:</tspan> every game that kicked off is final (the last slate goes final)</text>
<circle cx="715" cy="376" r="11" class="bd"/><text x="715" y="376" class="bt">4</text>
<text x="734" y="380" class="lg"><tspan class="lgn">Quiet to Off-season:</tspan> both leagues&#x27; championship weeks are scored</text>
<circle cx="715" cy="400" r="11" class="bd"/><text x="715" y="400" class="bt">5</text>
<text x="734" y="404" class="lg"><tspan class="lgn">Live to Live:</tspan> a slate goes final: a cold run saves that slate&#x27;s forecast to history</text>
<rect x="24" y="476" width="1344" height="150" rx="10" class="grp grp-hot"/>
<text x="40" y="500" class="gl" text-anchor="start">ONE HOT RUN  (Cloudflare Worker clock, GitHub Actions job, writes Cloudflare KV; never commits)</text>
<rect x="40" y="516" width="190" height="92" rx="8" class="st"/>
<text x="52" y="538" class="stt" text-anchor="start">Clock</text>
<text x="52" y="557" class="sd" text-anchor="start">Each minute the Worker</text>
<text x="52" y="573" class="sd" text-anchor="start">works out the mode; is</text>
<text x="52" y="589" class="sd" text-anchor="start">a hot run due?</text>
<rect x="260" y="516" width="190" height="92" rx="8" class="st"/>
<text x="272" y="538" class="stt" text-anchor="start">Already running?</text>
<text x="272" y="557" class="sd" text-anchor="start">Yes: skip this minute.</text>
<text x="272" y="573" class="sd" text-anchor="start">No: start one.</text>
<path d="M232 562.0 H257" class="e" marker-end="url(#a)"/>
<rect x="480" y="516" width="190" height="92" rx="8" class="st"/>
<text x="492" y="538" class="stt" text-anchor="start">Restore inputs</text>
<text x="492" y="557" class="sd" text-anchor="start">The latest cold run&#x27;s</text>
<text x="492" y="573" class="sd" text-anchor="start">build cache (ratings,</text>
<text x="492" y="589" class="sd" text-anchor="start">projections, WAR...)</text>
<path d="M452 562.0 H477" class="e" marker-end="url(#a)"/>
<rect x="700" y="516" width="190" height="92" rx="8" class="st"/>
<text x="712" y="538" class="stt" text-anchor="start">Live data</text>
<text x="712" y="557" class="sd" text-anchor="start">Current-week matchups</text>
<text x="712" y="573" class="sd" text-anchor="start">and the NFL scoreboard</text>
<path d="M672 562.0 H697" class="e" marker-end="url(#a)"/>
<rect x="920" y="516" width="190" height="92" rx="8" class="st"/>
<text x="932" y="538" class="stt" text-anchor="start">Simulate + cards</text>
<text x="932" y="557" class="sd" text-anchor="start">Live week, 10,000 runs;</text>
<text x="932" y="573" class="sd" text-anchor="start">this week&#x27;s game cards</text>
<path d="M892 562.0 H917" class="e" marker-end="url(#a)"/>
<rect x="1140" y="516" width="190" height="92" rx="8" class="st"/>
<text x="1152" y="538" class="stt" text-anchor="start">One KV write</text>
<text x="1152" y="557" class="sd" text-anchor="start">Bundle: forecasts, cards,</text>
<text x="1152" y="573" class="sd" text-anchor="start">game status, time</text>
<path d="M1112 562.0 H1137" class="e" marker-end="url(#a)"/>
<rect x="24" y="672" width="1344" height="150" rx="10" class="grp grp-cold"/>
<text x="40" y="696" class="gl" text-anchor="start">ONE COLD RUN  (GitHub Actions, writes git and GitHub Pages; never reads the live bundle)</text>
<rect x="40" y="712" width="190" height="92" rx="8" class="st"/>
<text x="52" y="734" class="stt" text-anchor="start">Trigger</text>
<text x="52" y="753" class="sd" text-anchor="start">15 min, button, slate</text>
<text x="52" y="769" class="sd" text-anchor="start">final, or daily</text>
<rect x="260" y="712" width="190" height="92" rx="8" class="st"/>
<text x="272" y="734" class="stt" text-anchor="start">Full sync</text>
<text x="272" y="753" class="sd" text-anchor="start">Rosters, moves, stats,</text>
<text x="272" y="769" class="sd" text-anchor="start">projections, schedule</text>
<path d="M232 758.0 H257" class="e" marker-end="url(#a)"/>
<rect x="480" y="712" width="190" height="92" rx="8" class="st"/>
<text x="492" y="734" class="stt" text-anchor="start">Records</text>
<text x="492" y="753" class="sd" text-anchor="start">Game log, slate forecasts,</text>
<text x="492" y="769" class="sd" text-anchor="start">scored weeks, frozen</text>
<text x="492" y="785" class="sd" text-anchor="start">projections</text>
<path d="M452 758.0 H477" class="e" marker-end="url(#a)"/>
<rect x="700" y="712" width="190" height="92" rx="8" class="st"/>
<text x="712" y="734" class="stt" text-anchor="start">Rebuild derived</text>
<text x="712" y="753" class="sd" text-anchor="start">Ratings, replacement,</text>
<text x="712" y="769" class="sd" text-anchor="start">WAR, site export</text>
<path d="M672 758.0 H697" class="e" marker-end="url(#a)"/>
<rect x="920" y="712" width="190" height="92" rx="8" class="st"/>
<text x="932" y="734" class="stt" text-anchor="start">Save build cache</text>
<text x="932" y="753" class="sd" text-anchor="start">The newest one is what</text>
<text x="932" y="769" class="sd" text-anchor="start">hot runs restore</text>
<path d="M892 758.0 H917" class="e" marker-end="url(#a)"/>
<rect x="1140" y="712" width="190" height="92" rx="8" class="st"/>
<text x="1152" y="734" class="stt" text-anchor="start">Changed?</text>
<text x="1152" y="753" class="sd" text-anchor="start">No: end.</text>
<text x="1152" y="769" class="sd" text-anchor="start">Yes: commit records,</text>
<text x="1152" y="785" class="sd" text-anchor="start">deploy Pages</text>
<path d="M1112 758.0 H1137" class="e" marker-end="url(#a)"/>
<path d="M1015 712 V656 H575 V612" class="e dash" marker-end="url(#s)"/>
<text x="685" y="650" class="dl" text-anchor="start">build cache: the inputs every hot run starts from</text>
</svg>